{% extends 'base.html' %}

{% block title %}Chatbot{% endblock %}

{% block head %}
    <link rel="stylesheet" href="/static/styles/chatbot_styles.css">
{% endblock %}

{% block content %}
    <div id="chatbot">
        <button type="submit" id="endChat" value="End" hx-post="/end-chat" hx-target="#chatbot" hx-disabled-elt="next button, next input, closest button">End Chat</button>
        <ul id="all_messages">
            {% include 'display-chats.html' %}
        </ul>
        <form id="chatForm" method="POST" hx-post="/send-chat" hx-target="#all_messages" hx-disabled-elt="find button, find input, previous #endChat">
            <label for="userInput"></label><br>
            <input type="text" id="userInput" name="userInput" size="50">
            <button type="submit" id="submit" value="Submit">Send</button>
        </form>
    </div>
    <script src="/static/scripts/chatbot.js"></script>

{% endblock %}
